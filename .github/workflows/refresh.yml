name: refresh-contests

# 每 30 分钟自动抓取赛事数据并更新 GitHub Pages
on:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取三个数据源生成快照
        run: node scripts/crawler.js

      - name: 更新发布目录
        run: cp public/snapshot.js docs/snapshot.js

      - name: 提交更新
        run: |
          git config user.name "contest-bot"
          git config user.email "contest-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "自动更新赛事数据 $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
